<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.C.Drama - Página 4</title>
  <link rel="icon" href="/static/img/logo.png" type="image/png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{background-color:#141414;color:#fff;padding:20px 40px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;width:100%}
    .logo-box{display:flex;align-items:center;gap:12px;text-decoration:none}
    .logo-icon{height:42px;width:auto;object-fit:contain}
    .logo-text{font-size:28px;font-weight:800;color:#fff;letter-spacing:-0.5px}
    .logo-text span{color:#E50914}
    .search-box{background:#000;border:1px solid #333;border-radius:20px;padding:8px 18px;width:280px;display:flex;align-items:center}
    .search-box input{background:transparent;border:none;color:#fff;outline:none;width:100%;font-size:14px}
    .main-title{font-size:36px;font-weight:800;margin-bottom:30px}
    .section-title{font-size:22px;font-weight:700;margin-top:35px;margin-bottom:15px;display:flex;align-items:center;gap:10px}
    .section-title::before{content:'';display:inline-block;width:4px;height:20px;background-color:#E50914;border-radius:2px}
    .empty-msg{color:#757575;font-size:15px;margin-left:14px;margin-bottom:20px}
    .movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin-bottom:30px}
    .movie-card{background:#1f1f1f;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;position:relative}
    .movie-card:hover{transform:scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.7)}
    .poster-img{width:100%;height:260px;object-fit:cover;display:block}
    .card-info{padding:12px}
    .card-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .edit-controls{display:none;padding:0 12px 12px;gap:8px}
    .edit-mode .edit-controls{display:flex}
    .btn-danger{background:#E50914;color:#fff;border:none;padding:6px;border-radius:4px;cursor:pointer;font-size:12px;flex:1}
    .auth-overlay,.secret-panel{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:1000;justify-content:center;align-items:center}
    .auth-card,.panel-box{background:#181818;border:1px solid #333;padding:30px;border-radius:12px;width:90%;max-width:450px}
    .panel-box h3,.auth-card h3{margin-bottom:15px;color:#fff}
    .form-group{margin-bottom:15px}
    .form-group label{display:block;margin-bottom:6px;color:#aaa;font-size:13px}
    .form-group input,.form-group textarea,.auth-card input{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#2b2b2b;color:#fff;outline:none}
    .btn-red{background:#E50914;color:#fff;border:none;padding:12px;border-radius:6px;cursor:pointer;font-weight:bold;width:100%}
    .info-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);z-index:2000;justify-content:center;align-items:center;padding:20px}
    .info-banner{position:relative;width:100%;max-width:900px;border-radius:12px;overflow:hidden;background:#181818;border:1px solid #282828;box-shadow:0 20px 60px rgba(0,0,0,.9)}
    .banner-hero{position:relative;width:100%;height:380px;background-size:cover;background-position:center}
    .banner-gradient{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(24,24,24,.1) 0%,rgba(24,24,24,.85) 70%,#181818 100%)}
    .banner-content{position:relative;padding:0 40px 40px;margin-top:-100px}
    .banner-title{font-size:3rem;font-weight:800;margin-bottom:12px;text-shadow:0 4px 10px rgba(0,0,0,.9)}
    .banner-tags{display:flex;gap:10px;margin-bottom:20px;align-items:center}
    .tag-hd{border:1px solid #757575;color:#ccc;padding:2px 8px;border-radius:4px;font-size:12px}
    .tag-badge{background:#E50914;color:#fff;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:bold}
    .banner-desc{font-size:15px;line-height:1.6;color:#ccc;max-width:650px;margin-bottom:30px}
    .btn-play{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#000;border:none;padding:12px 32px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer}
    .close-btn{position:absolute;top:15px;right:20px;background:#181818;border:none;color:#fff;font-size:28px;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;justify-content:center;align-items:center;z-index:10}
    .player-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:3000;justify-content:center;align-items:center}
    .player-container{width:90%;max-width:960px;position:relative}
    video,iframe{width:100%;height:520px;background:#000;border-radius:8px;border:none}
    #episodesListContainer{display:none;margin-top:20px;max-height:220px;overflow-y:auto;border-top:1px solid #333;padding-top:15px}
    .episodes-list{display:flex;flex-direction:column;gap:10px}
    .ep-item{background:#2b2b2b;padding:12px 16px;border-radius:6px;cursor:pointer;transition:background .2s;font-size:14px;display:flex;justify-content:space-between;align-items:center}
    .ep-item:hover{background:#444}
    .ep-item span{font-weight:bold;color:#E50914}
    .player-close-btn{position:absolute;top:-15px;right:-15px;background:#E50914;color:#fff;border:2px solid #141414;font-size:24px;font-weight:bold;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;justify-content:center;align-items:center;z-index:3001}
    .series-navigation{display:flex;justify-content:space-between;align-items:center;margin-top:15px;background:#181818;padding:12px 20px;border-radius:8px;border:1px solid #282828}
    .btn-nav{background:#E50914;color:#fff;border:none;padding:8px 18px;border-radius:4px;font-weight:bold;font-size:14px;cursor:pointer}
    .btn-nav:disabled{background:#333;color:#777;cursor:not-allowed}
    .ep-nav-title{font-size:15px;font-weight:600;color:#fff;text-align:center}
    @media(max-width:768px){body{padding:12px 15px}header{flex-direction:column;align-items:flex-start;gap:15px}.search-box{width:100%}.logo-icon{height:35px}.logo-text{font-size:24px}.main-title{font-size:24px}.movie-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.poster-img{height:190px}.banner-title{font-size:1.8rem}.banner-hero{height:220px}}
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyAll6C8PPZtf02uYX2DUssS0TVA-S0f0b4",
      authDomain: "cinestream-b7d94.firebaseapp.com",
      databaseURL: "https://cinestream-b7d94-default-rtdb.firebaseio.com",
      projectId: "cinestream-b7d94",
      storageBucket: "cinestream-b7d94.firebasestorage.app",
      messagingSenderId: "237145922828",
      appId: "1:237145922828:web:50b9f3396816ae4bdbbd29",
      measurementId: "G-VJSZGZMN3E"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.db = db;
    window.dbRef = ref;
    window.dbPush = push;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
  </script>
</head>
<body>
  <header>
    <a href="index.html" class="logo-box">
      <img src="/static/img/logo.png" alt="logo" class="logo-icon">
      <div class="logo-text">K.C.<span>Drama</span></div>
    </a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar serie..." onkeyup="filterContent()">
    </div>
  </header>

  <h1 class="main-title">Página 4 - Series</h1>
  <div class="section-title">Series</div>
  <div id="seriesContainer" class="movie-grid"></div>
  <div id="noSeriesMsg" class="empty-msg">No hay series todavía. Usa el atajo para agregar.</div>

  <!-- Modal Contraseña -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-card">
      <h3>Acceso Restringido</h3>
      <input type="password" id="authPassword" placeholder="Contraseña de administrador">
      <p id="authError" style="color:#E50914;font-size:12px;display:none;margin-top:8px">Contraseña incorrecta</p>
      <button class="btn-red" style="margin-top:15px" onclick="verifyPassword()">Ingresar</button>
      <button style="background:none;border:none;color:#aaa;width:100%;margin-top:10px;cursor:pointer" onclick="closeAuthModal()">Cancelar</button>
    </div>
  </div>

  <!-- Panel Series -->
  <div class="secret-panel" id="seriesSecretPanel">
    <div class="panel-box">
      <h3>Agregar Nueva Serie</h3>
      <form id="seriesForm">
        <div class="form-group"><label>Título de la Serie:</label><input type="text" id="seriesTitle" required></div>
        <div class="form-group"><label>Descripción General:</label><textarea id="seriesDesc" rows="3"></textarea></div>
        <div class="form-group"><label>Imagen de Portada (URL):</label><input type="text" id="seriesPosterUrl" required></div>
        <button type="submit" class="btn-red">Guardar Serie</button>
        <button type="button" style="background:none;border:none;color:#aaa;width:100%;margin-top:10px;cursor:pointer" onclick="closePanel('seriesSecretPanel')">Cerrar</button>
      </form>
    </div>
  </div>

  <!-- Panel Episodios -->
  <div class="secret-panel" id="episodeSecretPanel">
    <div class="panel-box">
      <h3>Agregar Episodio</h3>
      <form id="episodeForm">
        <input type="hidden" id="epSerieKey">
        <div style="display:flex;gap:10px">
          <div class="form-group" style="flex:1"><label>Temporada:</label><input type="number" id="epSeason" min="1" value="1" required></div>
          <div class="form-group" style="flex:1"><label>Episodio:</label><input type="number" id="epNumber" min="1" value="1" required></div>
        </div>
        <div class="form-group"><label>Título del Episodio:</label><input type="text" id="epTitle"></div>
        <div class="form-group"><label>Enlace de Video (.mp4 / iframe):</label><input type="text" id="epSource" required></div>
        <button type="submit" class="btn-red">Guardar Episodio</button>
        <button type="button" style="background:none;border:none;color:#aaa;width:100%;margin-top:10px;cursor:pointer" onclick="closePanel('episodeSecretPanel')">Cerrar</button>
      </form>
    </div>
  </div>

  <!-- Info Modal -->
  <div class="info-overlay" id="infoModal">
    <div class="info-banner">
      <button class="close-btn" onclick="closeInfoModal()">&times;</button>
      <div class="banner-hero" id="infoHero"><div class="banner-gradient"></div></div>
      <div class="banner-content">
        <h1 class="banner-title" id="infoTitle">Título</h1>
        <div class="banner-tags">
          <span class="tag-badge" id="infoBadge">Serie</span>
          <span class="tag-hd">HD</span>
        </div>
        <p class="banner-desc" id="infoDesc">Sin descripción disponible.</p>
        <button class="btn-play" id="infoPlayBtn" style="display:none">▶ Reproducir</button>
        <div id="episodesListContainer"></div>
      </div>
    </div>
  </div>

  <!-- Player -->
  <div class="player-overlay" id="playerModal">
    <div class="player-container">
      <button class="close-btn player-close-btn" onclick="closePlayer()">&times;</button>
      <video id="localVideoPlayer" controls autoplay style="display:none"></video>
      <div id="playerContainer" style="position:relative;width:100%;height:520px">
        <iframe id="iframeVideoPlayer" src="" allowfullscreen referrerpolicy="no-referrer" style="display:none;width:100%;height:100%;border:none"></iframe>
        <div id="popunderOverlay" onclick="ejecutarPopunder()" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:999;cursor:pointer;justify-content:center;align-items:center;background:rgba(0,0,0,.3)">
          <div style="width:80px;height:80px;background:rgba(229,9,20,.9);border-radius:50%;display:flex;justify-content:center;align-items:center">
            <div style="width:0;height:0;border-top:15px solid transparent;border-bottom:15px solid transparent;border-left:25px solid white;margin-left:5px"></div>
          </div>
        </div>
      </div>
      <div id="seriesControls" class="series-navigation" style="display:none">
        <button id="btnPrevEp" class="btn-nav" onclick="navigateEpisode(-1)">◄ Anterior</button>
        <span id="currentEpTitle" class="ep-nav-title"></span>
        <button id="btnNextEp" class="btn-nav" onclick="navigateEpisode(1)">Siguiente ►</button>
      </div>
    </div>
  </div>

  <script>
    const pressedKeys = new Set();
    let isEditMode = false;
    let pendingPanelTarget = null;
    const SECRET_KEY = "Barcelona10";
    let catalog = { series: {} };

    window.addEventListener('load', () => {
      const checkFirebase = setInterval(() => {
        if (window.db) {
          clearInterval(checkFirebase);
          listenToFirebase();
        }
      }, 100);
    });

    function listenToFirebase() {
      window.dbOnValue(window.dbRef(window.db, 'catalog_page4'), (snapshot) => {
        const data = snapshot.val() || { series: {} };
        catalog = data;
        renderSeries();
      });
    }

    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.key.toLowerCase());
      if (pressedKeys.has('z') && pressedKeys.has('c') && pressedKeys.has('b')) requestAccess('seriesSecretPanel');
      if (pressedKeys.has('1') && pressedKeys.has('0')) requestAccess('toggleEditMode');
    });
    window.addEventListener('keyup', (e) => pressedKeys.delete(e.key.toLowerCase()));

    function requestAccess(target) {
      pendingPanelTarget = target;
      document.getElementById('authPassword').value = '';
      document.getElementById('authError').style.display = 'none';
      document.getElementById('authModal').style.display = 'flex';
      document.getElementById('authPassword').focus();
    }

    function verifyPassword() {
      if (document.getElementById('authPassword').value === SECRET_KEY) {
        document.getElementById('authModal').style.display = 'none';
        if (pendingPanelTarget === 'toggleEditMode') {
          isEditMode = !isEditMode;
          document.body.classList.toggle('edit-mode', isEditMode);
        } else if (pendingPanelTarget) {
          document.getElementById(pendingPanelTarget).style.display = 'flex';
        }
        pendingPanelTarget = null;
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }

    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function closePanel(panelId) { document.getElementById(panelId).style.display = 'none'; }

    function filterContent() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.movie-card').forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        card.style.display = title.includes(query) ? '' : 'none';
      });
    }

    function renderSeries() {
      const container = document.getElementById('seriesContainer');
      const emptyMsg = document.getElementById('noSeriesMsg');
      const items = catalog.series || {};
      const keys = Object.keys(items);
      container.innerHTML = '';
      if (keys.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      keys.forEach(key => {
        const item = items[key];
        const posterHTML = item.poster ? `<img src="${item.poster}" class="poster-img" alt="Portada">` : '<div class="poster-img" style="background:#222"></div>';
        container.innerHTML += `
          <div class="movie-card">
            <div onclick="openInfoModal('${key}')">
              ${posterHTML}
              <div class="card-info"><div class="card-title">${item.title}</div></div>
            </div>
            <div class="edit-controls">
              <button class="btn-danger" style="background:#0078ff" onclick="openEpisodePanel('${key}')">+ Ep</button>
              <button class="btn-danger" onclick="deleteSeries('${key}')">Eliminar</button>
            </div>
          </div>`;
      });
    }

    function openInfoModal(key) {
      const item = catalog.series[key];
      if (!item) return;
      document.getElementById('infoTitle').innerText = item.title;
      document.getElementById('infoDesc').innerText = item.desc && item.desc.trim() !== '' ? item.desc : "Sin descripción disponible.";
      document.getElementById('infoBadge').innerText = 'Serie';
      document.getElementById('infoHero').style.backgroundImage = item.poster ? `url('${item.poster}')` : 'none';
      const epContainer = document.getElementById('episodesListContainer');
      epContainer.style.display = 'block';
      const rawEpisodes = item.episodes ? Object.values(item.episodes) : [];
      currentSeriesEpisodes = rawEpisodes.sort((a, b) => a.season - b.season || a.epNum - b.epNum);
      let epsHtml = '<h3 style="margin-bottom:12px;font-size:16px">Episodios</h3><div class="episodes-list">';
      if (currentSeriesEpisodes.length === 0) {
        epsHtml += '<p style="color:#757575;font-size:14px">No hay episodios agregados aún.</p>';
      } else {
        currentSeriesEpisodes.forEach((ep, index) => {
          epsHtml += `<div class="ep-item" onclick="closeInfoModal();playEpisodeByIndex(${index})"><div>T${ep.season} - E${ep.epNum} : ${ep.title || 'Episodio ' + ep.epNum}</div><span>▶ Ver</span></div>`;
        });
      }
      epContainer.innerHTML = epsHtml + '</div>';
      document.getElementById('infoModal').style.display = 'flex';
    }

    function closeInfoModal() { document.getElementById('infoModal').style.display = 'none'; }

    function playMedia(url) {
      const modal = document.getElementById('playerModal');
      const videoTag = document.getElementById('localVideoPlayer');
      const iframeTag = document.getElementById('iframeVideoPlayer');
      const popunderOverlay = document.getElementById('popunderOverlay');
      if (url.includes('.mp4') || url.includes('.webm')) {
        iframeTag.style.display = 'none'; iframeTag.src = '';
        videoTag.src = url; videoTag.style.display = 'block';
        popunderOverlay.style.display = 'none';
        modal.style.display = 'flex'; videoTag.play();
      } else {
        videoTag.style.display = 'none'; videoTag.src = '';
        iframeTag.src = url; iframeTag.style.display = 'block';
        popunderOverlay.style.display = 'flex';
        modal.style.display = 'flex';
      }
    }

    let contadorPopunders = 0;
    const TOTAL_POPUNDERS = 5;
    const URL_POPUNDER = "https://omg10.com/4/11582874";

    function ejecutarPopunder() {
      contadorPopunders++;
      window.open(URL_POPUNDER, '_blank');
      if (contadorPopunders >= TOTAL_POPUNDERS) {
        document.getElementById('popunderOverlay').style.display = 'none';
      }
    }

    function closePlayer() {
      const videoTag = document.getElementById('localVideoPlayer');
      const iframeTag = document.getElementById('iframeVideoPlayer');
      const navContainer = document.getElementById('seriesControls');
      videoTag.pause(); videoTag.src = '';
      iframeTag.src = '';
      document.getElementById('playerModal').style.display = 'none';
      navContainer.style.display = 'none';
      currentEpisodeIndex = -1;
    }

    document.getElementById('seriesForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        title: document.getElementById('seriesTitle').value,
        desc: document.getElementById('seriesDesc').value,
        poster: document.getElementById('seriesPosterUrl').value
      };
      window.dbPush(window.dbRef(window.db, 'catalog_page4/series'), data);
      document.getElementById('seriesForm').reset();
      closePanel('seriesSecretPanel');
    });

    function openEpisodePanel(seriesKey) {
      document.getElementById('epSerieKey').value = seriesKey;
      document.getElementById('episodeForm').reset();
      document.getElementById('episodeSecretPanel').style.display = 'flex';
    }

    document.getElementById('episodeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const seriesKey = document.getElementById('epSerieKey').value;
      const episodeData = {
        season: parseInt(document.getElementById('epSeason').value),
        epNum: parseInt(document.getElementById('epNumber').value),
        title: document.getElementById('epTitle').value,
        src: document.getElementById('epSource').value
      };
      window.dbPush(window.dbRef(window.db, `catalog_page4/series/${seriesKey}/episodes`), episodeData);
      closePanel('episodeSecretPanel');
    });

    function deleteSeries(key) {
      window.dbRemove(window.dbRef(window.db, `catalog_page4/series/${key}`));
    }

    let currentSeriesEpisodes = [];
    let currentEpisodeIndex = -1;

    function playEpisodeByIndex(index) {
      if (index < 0 || index >= currentSeriesEpisodes.length) return;
      currentEpisodeIndex = index;
      const ep = currentSeriesEpisodes[index];
      const navContainer = document.getElementById('seriesControls');
      const titleDisplay = document.getElementById('currentEpTitle');
      const btnPrev = document.getElementById('btnPrevEp');
      const btnNext = document.getElementById('btnNextEp');
      navContainer.style.display = 'flex';
      titleDisplay.innerText = `T${ep.season} E${ep.epNum}: ${ep.title || 'Episodio ' + ep.epNum}`;
      btnPrev.disabled = index === 0;
      btnNext.disabled = index === currentSeriesEpisodes.length - 1;
      playMedia(ep.src);
    }

    function navigateEpisode(direction) {
      const newIndex = currentEpisodeIndex + direction;
      if (newIndex >= 0 && newIndex < currentSeriesEpisodes.length) {
        playEpisodeByIndex(newIndex);
      }
    }
  </script>

  <!-- Navegación -->
  <div style="display:flex;justify-content:center;gap:10px;margin:50px 0 30px;flex-wrap:wrap">
    <a href="index.html" style="background:#2b2b2b;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:600">Inicio</a>
    <a href="page2.html" style="background:#2b2b2b;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:600">Página 2</a>
    <a href="page3.html" style="background:#2b2b2b;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:600">Página 3</a>
    <a href="page4.html" style="background:#E50914;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:600">Página 4</a>
  </div>
</body>
</html>
